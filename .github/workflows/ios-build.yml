name: Build Example App for iOS

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  ios-build:
    name: Build Example App on iOS (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - platform: ios
            runner: macos-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'npm'
      
      - name: Install component dependencies
        run: npm ci
      
      - name: Install example app dependencies
        working-directory: example
        run: npm ci
      
      - name: Install CocoaPods
        if: matrix.platform == 'ios'
        working-directory: example/ios
        run: |
          sudo gem install cocoapods
          pod install
      
      # - name: Cache CocoaPods
      #   if: matrix.platform == 'ios'
      #   uses: actions/cache@v4
      #   with:
      #     path: |
      #       ~/.cocoapods
      #       example/ios/Pods
      #     key: ${{ runner.os }}-pods-${{ hashFiles('**/Podfile.lock') }}
      #     restore-keys: |
      #       ${{ runner.os }}-pods-
      
      # - name: Cache iOS Build
      #   if: matrix.platform == 'ios'
      #   uses: irgaly/xcode-cache@v1
      #   with:
      #     deriveddata-directory: xcode-derived-data
      #     key: xcode-cache-deriveddata-${{ github.workflow }}-${{ github.sha }}
      #     restore-keys: xcode-cache-deriveddata-${{ github.workflow }}-
      
      - name: Listing available xcode version
        run: ls /Applications | grep Xcode

      - name: Listing current version of xcode being used by the MacOS image
        run: xcodebuild -version
      
      - name: Set up the desired Xcode version
        run: |
          sudo xcode-select -s \
          /Applications/Xcode_26.0.1.app/Contents/Developer
      
      - name: Listing current version of xcode being used by the MacOS image 2.0
        run: xcodebuild -version

      - name: Listing current version of xcode path being used
        run: xcode-select -p

      - name: Correctly fetch the metal toolchain
        run: xcodebuild -downloadComponent metalToolchain
      
      - name: Pre-load iOS Platform SDK
        run: xcodebuild -downloadPlatform iOS


      - name: Build iOS app
        if: matrix.platform == 'ios'
        working-directory: example/ios
        run: |
          rm .xcode.env.local
          set -o pipefail
          xcodebuild -workspace example.xcworkspace \
                     -scheme example \
                     -sdk iphonesimulator \
                     -configuration Debug \
                     -derivedDataPath ../../xcode-derived-data \
                     clean build | xcpretty